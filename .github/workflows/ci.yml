name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # PR revisions may supersede older PR work, but every main push retains
  # its own complete compatibility evidence (pending runs must not collide).
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        racket-version: ["9.0", "9.3"]
        # Fast PR feedback: latest Racket on all three OSes, legacy 9.0
        # on Linux. Every main push still exercises the full 3 x 2 matrix.
        exclude: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"windows-latest","racket-version":"9.0"},{"os":"macos-latest","racket-version":"9.0"}]' || '[]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: ${{ matrix.racket-version }}
      - name: Install package
        run: raco pkg install --auto --no-docs --name graft "${{ github.workspace }}"
      - name: Compile
        run: raco make graft/main.rkt graft-doc/scribblings/graft.scrbl examples/symbolic-regression.rkt
      - name: Test
        run: raco test -p graft

  quality:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: "9.3"
      - name: Install package with documentation
        run: raco pkg install --auto --name graft "${{ github.workspace }}"
      - name: Check declared package dependencies
        run: raco setup --check-pkg-deps graft
      - name: Build reference manual
        run: raco scribble --htmls --dest "${{ runner.temp }}/graft-doc" graft-doc/scribblings/graft.scrbl
      - name: Run seeded walkthrough
        run: racket examples/symbolic-regression.rkt
      - name: Require a clean generated tree
        run: git diff --exit-code
